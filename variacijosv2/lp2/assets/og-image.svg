  <text x="955" y="382" font-family="Sora, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">Eglė, 27</text>
  <text x="955" y="408" font-family="Nunito Sans, Arial, sans-serif" font-size="17" fill="#475569" text-anchor="middle">Vilnius</text>

  <circle cx="900" cy="440" r="24" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
  <line x1="891" y1="431" x2="909" y2="449" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <line x1="909" y1="431" x2="891" y2="449" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <circle cx="1010" cy="440" r="24" fill="#E11D48"/>
  <path d="M1010 452s-15-8.7-19.2-18C989 429.7 992.6 421 999.3 421c4 0 6.9 2.2 10.7 6.8 3.8-4.6 6.7-6.8 10.7-6.8 6.7 0 10.3 8.7 6.2 13-4.2 9.3-16.9 18-16.9 18z" fill="#ffffff"/>
